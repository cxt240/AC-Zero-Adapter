name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Test
        run: dotnet test ACZeroAdapter.sln --configuration Release

      - name: Publish
        run: dotnet publish src/ACZeroAdapter/ACZeroAdapter.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugSymbols=false -o publish

      - name: Attach the exe to the release
        uses: softprops/action-gh-release@v2
        with:
          files: publish/ACZeroAdapter.exe
          name: AC Zero Adapter ${{ github.ref_name }}
          body: |
            Download ACZeroAdapter.exe and run it on Windows. The .NET runtime is included, so there is nothing else to install.
            Close Ace Combat Zero before you press Apply, then quit the game completely and start it again.
